        <script>
            ;(function () {
                try {
                    var p = JSON.parse(localStorage.getItem('ch-preferences'))
                    var t = p && p.state && p.state.theme
                    if (t === 'light')
                        document.documentElement.classList.remove('dark')
                    else if (
                        t === 'system' &&
                        !window.matchMedia('(prefers-color-scheme: dark)')
                            .matches
                    )
                        document.documentElement.classList.remove('dark')
                } catch (e) {}
            })()
        </script>
